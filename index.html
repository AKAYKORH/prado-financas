<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Prado Finanças Corporativas | Gestão Financeira e Consultoria</title>
<meta name="description" content="Gestão financeira e consultoria para organizar o seu financeiro e trazer clareza às decisões do seu negócio."/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<style>
:root {
  --navy:       #0F1A2D;
  --navy-alt:   #2E4157;
  --slate:      #577D8E;
  --off-white:  #F3EFE8;
  --blue-light: #C7D9E4;
  --gray-light: #D1CECA;
  --white:      #FFFFFF;
  
  --font-display: "Tenor Sans", Georgia, serif;
  --font-body:    "Raleway", Arial, sans-serif;
  
  --radius: 3px;
  --line:   1px solid rgba(199,217,228,0.2);
  --shadow: 0 2px 24px rgba(15,26,45,0.08);
  --tr:     0.28s ease;
}

*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; font-size:16px; }
body { font-family:var(--font-body); background:var(--off-white); color:var(--navy); line-height:1.72; overflow-x:hidden; }
img  { max-width:100%; display:block; }
a    { color:inherit; text-decoration:none; }

h1, h2, h3 { font-family:var(--font-display); font-weight:400; line-height:1.18; letter-spacing:0.01em; }
h1 { font-size:clamp(1.8rem, 4vw, 2.6rem); } 
h2 { font-size:clamp(1.8rem, 4vw, 2.7rem); }
h3 { font-size:clamp(1rem, 2vw, 1.2rem); }

.eyebrow {
  display:block; font-family:var(--font-body); font-size:0.66rem; font-weight:500;
  letter-spacing:0.2em; text-transform:uppercase; color:var(--slate); margin-bottom:14px;
}
.section--dark .eyebrow,
.section--mid  .eyebrow { color:rgba(199,217,228,0.7); }

.divider { width:28px; height:1px; background:var(--slate); margin:16px 0 40px; opacity:0.45; }
.section--dark .divider,
.section--mid  .divider { background:var(--blue-light); }

.container { width:100%; max-width:1080px; margin:0 auto; padding:0 28px; }
.section    { padding:96px 0; }
.section--dark   { background:var(--navy);     color:var(--off-white); }
.section--mid    { background:var(--navy-alt); color:var(--off-white); }
.section--tinted { background:#EDEAE3; }

.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:9px; padding:13px 28px; border-radius:var(--radius);
  font-family:var(--font-body); font-size:0.82rem; font-weight:500; letter-spacing:0.07em;
  cursor:pointer; border:none; transition:var(--tr); white-space:nowrap;
}
.btn--primary { background:var(--off-white); color:var(--navy); }
.btn--primary:hover { background:var(--white); transform:translateY(-1px); }
.btn--outline { background:transparent; color:var(--off-white); border:1px solid rgba(199,217,228,0.38); }
.btn--outline:hover { border-color:var(--blue-light); background:rgba(199,217,228,0.06); }

/* ── HEADER ── */
#header {
  position:fixed; top:0; left:0; right:0; z-index:1000;
  background:rgba(15,26,45,0.96); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-bottom:var(--line);
}
.header__inner { display:flex; align-items:center; justify-content:space-between; height: 90px; } /* Cabeçalho mais alto */
.header__logo { display:flex; align-items:center; }
.header__logo img { height: 70px; width:auto; object-fit:contain; } /* Logo muito maior */

nav.header__nav { display:flex; align-items:center; gap:28px; }
nav.header__nav a {
  font-size:0.76rem; letter-spacing:0.08em; font-weight:400;
  color:rgba(243,239,232,0.58); transition:color var(--tr);
}
nav.header__nav a:hover { color:var(--off-white); }
.header__cta { margin-left:14px; }

/* ── HERO ── */
#hero {
  min-height:100vh; display:flex; align-items:center; position:relative; overflow:hidden;
  background:linear-gradient(148deg, #08111e 0%, #0F1A2D 35%, #162840 65%, #1a3050 100%);
  padding-top: 90px;
}
.hero__grid {
  position:absolute; inset:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(199,217,228,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(199,217,228,0.04) 1px, transparent 1px);
  background-size:70px 70px;
}
.hero__glow {
  position:absolute; top:20%; left:10%; width:800px; height:800px;
  background:radial-gradient(ellipse, rgba(87,125,142,0.13) 0%, transparent 60%);
  pointer-events:none;
}
.hero__glow2 {
  position:absolute; top:-10%; right:-5%; width:500px; height:600px;
  background:radial-gradient(ellipse, rgba(30,90,140,0.25) 0%, transparent 65%);
  pointer-events:none;
}
/* Flexbox para colocar Texto e Logo lado a lado */
.hero__content { 
  position:relative; 
  z-index:2; 
  color:var(--off-white); 
  display: flex; 
  flex-direction: row; 
  align-items: center; 
  justify-content: space-between;
  gap: 40px;
  width: 100%;
}
.hero__text {
  flex: 1;
  max-width: 600px;
}
.hero__image {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}
.hero__image img {
  max-width: 100%;
  max-height: 380px;
  object-fit: contain;
}

.hero__text .eyebrow { color:rgba(199,217,228,0.65); margin-bottom:20px; }
.hero__text h1 { color:var(--white); margin-bottom:24px; line-height:1.3; }
.hero__sub {
  font-size:1.05rem; color:rgba(243,239,232,0.75); margin-bottom:36px;
  max-width:540px; line-height:1.7; font-weight:300;
}
.hero__bullets { display:flex; gap:26px; margin-bottom:44px; flex-wrap:wrap; justify-content: flex-start; }
.hero__bullet {
  display:flex; align-items:center; gap:10px; font-size:0.72rem;
  letter-spacing:0.16em; text-transform:uppercase; color:var(--blue-light); font-weight:500;
}
.hero__bullet::before { content:''; width:20px; height:1px; background:var(--blue-light); flex-shrink:0; }
.hero__ctas { display:flex; gap:14px; flex-wrap:wrap; align-items:center; justify-content: flex-start; }

.hero__tagline {
  position:absolute; bottom:40px; left:28px; z-index:2;
  font-family:var(--font-body); font-size:0.68rem; letter-spacing:0.14em;
  text-transform:uppercase; color:rgba(199,217,228,0.32);
  padding-left:14px; border-left:1px solid rgba(199,217,228,0.18);
}

/* ── CARDS (Para quem) ── */
.cards-3 { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:20px; margin-top:48px; }
.card {
  background:var(--white); border:1px solid var(--gray-light); border-radius:var(--radius);
  padding:30px 26px; box-shadow:var(--shadow); transition:var(--tr);
}
.card:hover { transform:translateY(-3px); box-shadow:0 10px 36px rgba(15,26,45,0.12); }
.card__icon { width:34px; height:34px; margin-bottom:18px; opacity:0.48; }
.card h3 { margin-bottom:8px; font-family:var(--font-display); }
.card p  { font-size:0.88rem; color:var(--slate); line-height:1.68; }
.nota-box {
  margin-top:34px; padding:17px 22px; border-left:2px solid var(--blue-light);
  background:var(--white); font-size:0.83rem; color:var(--slate);
  border-radius:0 var(--radius) var(--radius) 0; display:inline-block;
}

/* ── SERVIÇOS ── */
.srv-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(295px,1fr)); gap:18px; margin-top:48px; }
.card-srv {
  border:var(--line); border-radius:var(--radius); padding:28px 24px;
  transition:var(--tr); position:relative; overflow:hidden;
}
.card-srv::before {
  content:''; position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent, rgba(199,217,228,0.5), transparent);
  transform:scaleX(0); transition:transform 0.45s ease;
}
.card-srv:hover::before { transform:scaleX(1); }
.card-srv:hover { background:rgba(199,217,228,0.04); }
.card-srv__num {
  font-family:var(--font-display); font-size:2.6rem;
  color:rgba(199,217,228,0.09); line-height:1; margin-bottom:12px;
}
.card-srv h3 {
  font-family:var(--font-display); font-size:0.98rem;
  margin-bottom:8px; color:var(--off-white); font-weight:400;
}
.card-srv .desc { font-size:0.83rem; color:rgba(199,217,228,0.55); margin-bottom:15px; line-height:1.68; }
.card-srv ul { list-style:none; display:flex; flex-direction:column; gap:6px; }
.card-srv ul li { font-size:0.78rem; color:rgba(199,217,228,0.44); padding-left:14px; position:relative; }
.card-srv ul li::before { content:'—'; position:absolute; left:0; color:rgba(199,217,228,0.25); }
.srv-footer {
  margin-top:52px; text-align:center; font-family:var(--font-display);
  font-size:1.2rem; color:rgba(199,217,228,0.5);
}
.srv-footer a { color:var(--blue-light); border-bottom:1px solid rgba(199,217,228,0.28); }

/* ── COMO FUNCIONA ── */
.steps { display:flex; flex-direction:column; gap:0; margin-top:48px; max-width:680px; }
.step  { display:grid; grid-template-columns:52px 1fr; gap:20px; position:relative; padding-bottom:36px; }
.step:last-child { padding-bottom:0; }
.step:not(:last-child)::after {
  content:''; position:absolute; left:25px; top:44px; bottom:0; width:1px;
  background:linear-gradient(to bottom, var(--gray-light), transparent);
}
.step__num {
  width:42px; height:42px; border-radius:50%; border:1px solid var(--gray-light);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-display);
  font-size:1rem; color:var(--slate); flex-shrink:0; background:var(--white);
}
.step__content h3 { font-family:var(--font-display); font-size:1rem; margin-bottom:5px; color:var(--navy); }
.step__content p  { font-size:0.87rem; color:var(--slate); line-height:1.75; }
.como-fecho {
  margin-top:42px; font-family:var(--font-display); font-size:1.1rem; color:var(--slate);
  border-top:1px solid var(--gray-light); padding-top:30px;
}

/* ── DIFERENCIAIS ── */
.dif-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(265px,1fr)); gap:16px; margin-top:48px; }
.dif-item {
  padding:22px 22px; border:var(--line); border-radius:var(--radius);
  display:flex; gap:14px; align-items:flex-start; transition:var(--tr);
}
.dif-item:hover { background:rgba(199,217,228,0.04); }
.dif-icon { width:15px; height:15px; flex-shrink:0; margin-top:3px; opacity:0.42; }
.dif-item p { font-size:0.86rem; color:rgba(199,217,228,0.68); line-height:1.66; }

/* ── SOBRE ── */
.sobre__inner { display:grid; grid-template-columns:320px 1fr; gap:72px; align-items:start; }
/* Margem no topo da foto para empurrar para baixo, e retirada dos filtros */
.sobre__foto { border-radius:12px; overflow:hidden; margin-top: 60px; }
.sobre__foto img { width:100%; height:auto; object-fit:cover; display:block; }

.sobre__texto p  { color:var(--slate); margin-bottom:18px; font-size:0.93rem; line-height:1.8; }
.sobre__quote {
  margin-top:28px; font-family:var(--font-display); font-size:1.22rem;
  color:var(--navy); border-left:2px solid var(--gray-light); padding-left:22px; line-height:1.5;
}

/* ── DEPOIMENTOS ── */
<section id="depoimentos" class="section section--tinted">

<section id="faq" class="section">
  <div class="container">
    <span class="eyebrow">Dúvidas Frequentes</span>
    <h2>Perguntas e Respostas</h2>
    <div class="divider"></div>
    <div class="faq__list">
      
      <div class="faq-item">
        <button class="faq-q">Você atende presencialmente? <span class="icon"></span></button>
        <div class="faq-a"><p>O atendimento é realizado de forma online, o que permite organização, agilidade e atendimento a empresas de diferentes regiões. Caso necessário, podemos alinhar reuniões presenciais pontuais.</p></div>
      </div>

      <div class="faq-item">
        <button class="faq-q">Você trabalha com exclusividade? <span class="icon"></span></button>
        <div class="faq-a"><p>Não trabalho com exclusividade. A atuação é organizada por escopo e demanda, garantindo qualidade e dedicação dentro do que foi acordado.</p></div>
      </div>

      <div class="faq-item">
        <button class="faq-q">Como funciona a consultoria por demanda? <span class="icon"></span></button>
        <div class="faq-a"><p>A consultoria por demanda funciona para necessidades pontuais, como análises específicas, dúvidas estratégicas ou organização de processos. Não exige contrato fixo mensal — é direcionada para situações específicas.</p></div>
      </div>

      <div class="faq-item">
        <button class="faq-q">Em quanto tempo vejo a organização no financeiro? <span class="icon"></span></button>
        <div class="faq-a"><p>Depende da estrutura atual da empresa, mas normalmente nas primeiras semanas já é possível perceber mais clareza e organização. A consolidação da estrutura costuma acontecer entre 30 e 60 dias.</p></div>
      </div>

      <div class="faq-item">
        <button class="faq-q">Quais informações você precisa para começar? <span class="icon"></span></button>
        <div class="faq-a"><p>Inicialmente, preciso entender o cenário atual: acesso às movimentações financeiras, relatórios disponíveis, extratos bancários, sistema utilizado e principais desafios enfrentados. A partir disso, é definido o plano de organização.</p></div>
      </div>

    </div>
  </div>
</section>

<section id="contato" class="section">

      <h2>Vamos estruturar o seu financeiro?</h2>

</section>

<footer id="footer">
  <div class="container footer__inner">
    <div class="footer__brand">

<script>
  document.querySelectorAll('.faq-q').forEach(button => {
    button.addEventListener('click', () => {
      const item = button.parentElement;
      const isOpen = item.classList.contains('open');
      
      // Opcional: Fechar todas as outras antes de abrir a clicada
      document.querySelectorAll('.faq-item').forEach(otherItem => {
        otherItem.classList.remove('open');
      });

      // Se não estava aberta, abre
      if (!isOpen) {
        item.classList.add('open');
      }
    });
  });
</script>

</body>
</html>
